name: Database links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # This test needs only requests, not MCC or its scientific dependencies.
      - name: Install test dependency
        run: python -m pip install requests
      - name: Check live database endpoints
        run: python -m unittest discover -s tests -p 'test_database_links.py' -v
